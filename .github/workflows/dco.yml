name: DCO

# Enforce the Developer Certificate of Origin: every non-merge commit in a PR
# must carry a `Signed-off-by:` trailer matching its author (see CONTRIBUTING.md).
# Dependency-free (no third-party action) and read-only.

on:
  pull_request:

concurrency:
  group: dco-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dco:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Every commit is signed off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          fail=0
          while read -r sha; do
            [ -z "$sha" ] && continue
            author="$(git show -s --format='%an <%ae>' "$sha")"
            subject="$(git show -s --format='%s' "$sha")"
            if git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "$sha" \
                 | grep -qiF -- "$author"; then
              echo "ok    ${sha:0:12}  $subject"
            else
              echo "FAIL  ${sha:0:12}  $subject"
              echo "        expected trailer: Signed-off-by: $author"
              fail=1
            fi
          done < <(git rev-list --no-merges "$BASE_SHA".."$HEAD_SHA")
          if [ "$fail" -ne 0 ]; then
            echo
            echo "::error::One or more commits lack a matching DCO sign-off (see CONTRIBUTING.md)."
            echo "Amend one commit:  git commit --amend -s --no-edit && git push --force-with-lease"
            echo "Sign a series:     git rebase --signoff \"$BASE_SHA\" && git push --force-with-lease"
            exit 1
          fi
          echo "All commits carry a matching DCO sign-off."
