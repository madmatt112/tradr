name: Security

# Three scanners, all free on public repositories, all publishing to the
# repository Security tab (code scanning):
#
#   CodeQL        static analysis of the TypeScript sources and the workflows
#   OSV-Scanner   dependency advisories resolved against pnpm-lock.yaml
#   zizmor        GitHub Actions workflow misconfiguration audit
#
# All three are ADVISORY: findings are reported but never fail the job, so
# none of these are merge gates yet. Promote them to required checks in branch
# protection once the existing backlog is triaged.
#
# None of them need a secret, so unlike the AI reviewer this replaces, they all
# run on pull requests from forks too.
#
# Actions are pinned to commit SHAs, not tags — a tag is mutable and the
# attacker-moved-the-tag class of supply-chain compromise (tj-actions,
# trivy-action) is exactly what a pin defeats. The trailing comment records the
# release each SHA corresponds to; update both together.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Advisories get published against code that hasn't changed, so scanning only
  # on push would go stale on a quiet week.
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # CodeQL replaces the AI security reviewer: same job (find vulnerabilities in
  # the code), but versioned, deterministic, and free for public repos.
  # `actions` analyses the workflow files themselves — it overlaps zizmor below
  # without subsuming it, since the two carry different query sets.
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read # upload-sarif needs it — github/codeql-action#2117
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          languages: ${{ matrix.language }}

      # No build step: both languages are analysed from source.
      - name: Analyze
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          category: /language:${{ matrix.language }}

  # OSV-Scanner over pnpm-lock.yaml. Chosen over Dependabot because Dependabot
  # still fails to parse pnpm `lockfileVersion: '9.0'` lockfiles like ours —
  # which is why this repo's dependency graph is empty.
  #
  # Google recommend the reusable workflow over calling the scanner action
  # directly, as the action's interface can shift within a minor release.
  dependencies:
    name: Dependency advisories (OSV)
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
    with:
      # Advisory: results reach the Security tab, the job still passes.
      fail-on-vuln: false

  # Audits the workflows for the misconfigurations behind the recent Actions
  # supply-chain compromises — pwn requests, cache poisoning, credential
  # persistence, unpinned third-party actions.
  workflows:
    name: Workflow audit (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5 # v0.6.1
        with:
          # Emits SARIF and uploads it. zizmor always exits 0 in this mode,
          # which is what keeps the job advisory.
          advanced-security: true
